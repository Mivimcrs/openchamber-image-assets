<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magic Raw Picture</title>
<style>
  :root {
    --background: #ffffff;
    --foreground: #18181b;
    --muted: #f4f4f5;
    --muted-foreground: #71717a;
    --border: #e4e4e7;
    --card: #ffffff;
    --primary: #18181b;
    --primary-foreground: #ffffff;
    --destructive: #dc2626;
    --success: #16a34a;
    --warning: #d97706;
    --radius: 8px;
    --font-sans: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --background: #171717;
      --foreground: #ededed;
      --muted: #262626;
      --muted-foreground: #a1a1aa;
      --border: #333333;
      --card: #1f1f1f;
      --primary: #ededed;
      --primary-foreground: #171717;
    }
  }
  :root[data-theme="dark"] {
    --background: #171717;
    --foreground: #ededed;
    --muted: #262626;
    --muted-foreground: #a1a1aa;
    --border: #333333;
    --card: #1f1f1f;
    --primary: #ededed;
    --primary-foreground: #171717;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
  }
  #root { display: flex; flex-direction: column; min-height: 100vh; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 6px; }
  .tabs { display: flex; gap: 4px; background: var(--muted); border-radius: var(--radius); padding: 3px; }
  .tab {
    border: 0; background: transparent; color: var(--muted-foreground);
    font: inherit; font-weight: 600; padding: 4px 8px; border-radius: 6px; cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .count { color: var(--muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .banner {
    margin: 4px 12px; padding: 8px 10px; border-radius: var(--radius);
    background: color-mix(in srgb, var(--destructive) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--destructive) 40%, transparent);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .banner button {
    font: inherit; font-weight: 600; border: 1px solid var(--border); background: var(--background);
    color: var(--foreground); border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap;
  }

  .toolbar { padding: 6px 12px; display: flex; flex-direction: column; gap: 6px; }
  .input, .textarea, select.input {
    width: 100%; font: inherit; color: var(--foreground); background: var(--background);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; outline: none;
  }
  .input:focus, .textarea:focus, select.input:focus { border-color: var(--muted-foreground); }
  .tagrow { display: flex; flex-wrap: wrap; gap: 4px; }
  .tagchip {
    font-size: 11px; border: 1px solid var(--border); background: var(--muted); color: var(--muted-foreground);
    border-radius: 999px; padding: 1px 8px; cursor: pointer;
  }
  .tagchip[aria-pressed="true"] { background: var(--foreground); color: var(--background); border-color: var(--foreground); }

  main { flex: 1; padding: 4px 12px 16px; }
  .empty { color: var(--muted-foreground); text-align: center; padding: 32px 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .tile {
    border: 1px solid var(--border); background: var(--card); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; padding: 0; font: inherit; color: inherit; text-align: left;
    position: relative;
  }
  .tile:hover { border-color: var(--muted-foreground); }
  .tile .ph { width: 100%; background: var(--muted); display: block; }
  .tile img { width: 100%; display: block; }
  .tile figcaption { padding: 4px 6px; font-size: 10.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .marks { position: absolute; top: 3px; left: 3px; display: flex; gap: 3px; pointer-events: none; }
  .mark {
    font-size: 9px; line-height: 14px; padding: 0 4px; border-radius: 4px;
    background: rgb(0 0 0 / .55); color: #fff; font-variant-numeric: tabular-nums;
  }
  .tile .alpha { position: absolute; top: 3px; right: 3px; width: 12px; height: 12px; border-radius: 3px;
    background: repeating-conic-gradient(#bbb 0% 25%, #fff 0% 50%) 50% / 6px 6px; border: 1px solid rgb(0 0 0 / .25); }

  .detail {
    position: fixed; inset: 0; background: var(--background); z-index: 20;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .detail .dhead {
    position: sticky; top: 0; background: var(--background); display: flex;
    align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  .detail .dbody { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .detail img.big { width: 100%; border-radius: var(--radius); border: 1px solid var(--border); background: var(--muted); }
  .meta { display: grid; grid-template-columns: 68px 1fr; gap: 4px 8px; font-size: 12px; }
  .meta dt { color: var(--muted-foreground); margin: 0; }
  .meta dd { margin: 0; word-break: break-all; }
  .meta dd.mono { font-family: var(--font-mono); font-size: 11px; }
  .prompt { white-space: pre-wrap; background: var(--muted); border-radius: 6px; padding: 8px; font-size: 12px; max-height: 160px; overflow-y: auto; }
  .section-label { font-size: 11px; font-weight: 700; color: var(--muted-foreground); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    background: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
  }
  .chip button { border: 0; background: none; color: var(--muted-foreground); cursor: pointer; font: inherit; padding: 0; }
  .row { display: flex; gap: 6px; }
  .btn {
    font: inherit; font-weight: 600; border: 1px solid var(--border); background: var(--background);
    color: var(--foreground); border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .btn.danger { color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 50%, var(--border)); }
  .btn.danger[data-armed="true"] { background: var(--destructive); color: #fff; border-color: var(--destructive); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .hint { color: var(--muted-foreground); font-size: 11.5px; }
  .tagadd { display: flex; gap: 6px; }
  .tagadd .input { flex: 1; }

  /* ---- 表单（创作 / 设置）---- */
  .form { display: flex; flex-direction: column; gap: 12px; padding: 8px 12px 20px; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .group > .ghead { display: flex; align-items: center; justify-content: space-between; }
  .ghead .gname { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--muted-foreground); text-transform: uppercase; }
  .line { display: flex; align-items: center; gap: 6px; }
  .line .k { width: 62px; flex: 0 0 auto; color: var(--muted-foreground); font-size: 11.5px; }
  .line .v { flex: 1; min-width: 0; }
  .seg { display: flex; gap: 2px; background: var(--muted); border-radius: 7px; padding: 2px; flex: 1; flex-wrap: wrap; }
  .seg button {
    flex: 1; min-width: 44px; border: 0; background: transparent; color: var(--muted-foreground);
    font: inherit; font-size: 11px; padding: 3px 0; border-radius: 5px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--foreground); font-weight: 700; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .refslots { display: flex; gap: 6px; flex-wrap: wrap; }
  .slot {
    width: 54px; height: 54px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--muted); overflow: hidden; position: relative; flex: 0 0 auto; padding: 0;
  }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot .x {
    position: absolute; top: 1px; right: 1px; width: 15px; height: 15px; border-radius: 50%;
    background: rgb(0 0 0 / .6); color: #fff; font-size: 10px; line-height: 15px; text-align: center;
  }
  .slot.add {
    border-style: dashed; background: transparent; color: var(--muted-foreground);
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .refrow { display: flex; gap: 5px; flex-wrap: wrap; }
  .refrow button { padding: 0; border: 0; background: none; cursor: pointer; }
  .refrow img { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); display: block; }
  .prog { height: 5px; border-radius: 999px; background: var(--muted); overflow: hidden; }
  .prog > i { display: block; height: 100%; background: var(--primary); transition: width .3s ease; }
  .caps { display: flex; gap: 4px; flex-wrap: wrap; }
  .cap { font-size: 9.5px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted-foreground); white-space: nowrap; }
  .cap.y { color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }
  .cap.q { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 40%, var(--border)); }
  .switch { width: 34px; height: 19px; border-radius: 999px; background: var(--muted); border: 1px solid var(--border); position: relative; cursor: pointer; flex: 0 0 auto; }
  .switch[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); }
  .switch i { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--card); transition: left .15s; }
  .switch[aria-pressed="true"] i { left: 17px; background: var(--primary-foreground); }
  .masked { flex: 1; font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--border); background: var(--background); border-radius: 6px; padding: 5px 8px; display: flex; justify-content: space-between; gap: 8px; }
  .ok { color: var(--success); }
  .bad { color: var(--destructive); }
  .group[data-iface] {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px; background: var(--card);
  }
  .iface-edit {
    display: flex; flex-direction: column; gap: 6px; margin-top: 6px; padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .pick {
    position: fixed; inset: 0; z-index: 30; background: var(--background); display: flex; flex-direction: column;
  }
  .pick .pbody { padding: 10px 12px; overflow-y: auto; flex: 1; }
  .pick .grid { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
  .result { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
  .result button { padding: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--muted); cursor: pointer; }
  .result img { width: 100%; display: block; }
</style>
</head>
<body>
<div id="root">
  <div id="diag" style="display:none; font: 11px ui-monospace, monospace; color: #d00; padding: 4px 12px; word-break: break-all; white-space: pre-wrap;"></div>
  <header class="bar">
    <nav class="tabs" id="tabs" aria-label="视图切换">
      <button class="tab" data-tab="session" type="button" aria-pressed="true">本次会话</button>
      <button class="tab" data-tab="all" type="button" aria-pressed="false">全部</button>
      <button class="tab" data-tab="create" type="button" aria-pressed="false">创作</button>
      <button class="tab" data-tab="settings" type="button" aria-pressed="false">设置</button>
    </nav>
    <span class="count" id="count"></span>
  </header>

  <div class="banner" id="banner" hidden>
    <span id="banner-text"></span>
    <button type="button" id="banner-retry">重试</button>
  </div>

  <div class="toolbar" id="toolbar">
    <input class="input" id="q" type="search" placeholder="搜索提示词 / 标签 / 备注 / 会话" />
    <div class="tagrow" id="tagrow"></div>
  </div>

  <main id="view"><div class="empty">加载中…</div></main>
</div>

<div class="detail" id="detail" hidden></div>
<div class="pick" id="pick" hidden></div>

<script src="./main.js"></script>
</body>
</html>
